name: Deploy SpeedPulse to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'main-files/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speedpulse-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate web files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css bundle.js manifest.json favicon.png; do
            test -s "main-files/$file"
          done
          node --check main-files/bundle.js
          node --check main-files/bundle-dev.js
          node --check main-files/sw.js
          node --test tests/site.test.cjs
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: main-files
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
